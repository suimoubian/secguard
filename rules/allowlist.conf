# SecGuard 白名单
#
# 作用:某个路径下,放行某些规则。用来解决"正常业务内容被 WAF 拦掉"。
#
# 格式(字段之间用 TAB 分隔):
#   路径前缀 <TAB> 规则ID[,规则ID...]     只放行列出的规则
#   路径前缀 <TAB> *                      该路径下全部规则都放行
#
# 以 # 开头是注释,空行跳过。文件缺失不算错误(等于空名单)。
#
# ---------------------------------------------------------------------------
# 为什么按"路径 + 规则"而不是按"内容"放行
#
# 按内容放行(比如"载荷里带某个标记就跳过检测")等于给攻击者发通行证 ——
# 他只要在自己的攻击里加上那个标记就绕过了。
#
# 按路径放行则是运维显式声明的信任边界:攻击者控制不了自己请求的路径
# 会命中哪条白名单规则。但代价是真实的 —— 某个路径排除了某条规则,
# 那条路径上就真的不再用这条规则拦人了。
#
# 所以这份文件必须小、必须有人审、必须写清楚为什么。
# ---------------------------------------------------------------------------
#
# 示例(默认全部注释掉,需要时自己打开并确认理由成立):
#
# 发帖接口:正文里讨论 SQL 是正常的("select * from user 这条语句")。
# 只排除那种"裸关键词"规则(select 后面带空格这类),不放行组合规则 ——
# union select、or 1=1 仍然会拦。
# /api/posts	SQL-003,SQL-004,SQL-007
#
# 文档站:整个站点是静态说明,不过检测。
# /docs	*
