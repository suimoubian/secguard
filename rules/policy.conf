# SecGuard 处置策略:规则命中之后怎么办
#
# 格式(每行两个字段,空格或 TAB 分隔):
#   default BLOCK|ALERT
#   <规则ID> BLOCK|ALERT
# 以 # 开头的行是注释。文件缺失 = 全部 BLOCK(行为退回加策略层之前)。
#
# ---------------------------------------------------------------------------
# 为什么要有这一层
# ---------------------------------------------------------------------------
# 规则库回答"这条流量像不像攻击",策略回答"像到什么程度才值得拦"。
# 两者混在一起,想降误报就只能删规则 —— 删了这条线索也就没了。
# 分开之后,过宽的规则可以降成 ALERT:仍然记录、仍然能查、仍然进 AI 分析,
# 只是不返回 403。**看得见但不挡**,这是可以量化的取舍。
#
# 实测依据(docs/评测数据/最新.md):48 条正常语料里 9 条误报,
# 其中 8 条来自下面这几条"单字面量"规则。
#
# ---------------------------------------------------------------------------
# 降级的判据(三条都要过)
# ---------------------------------------------------------------------------
#   1. 特征短且常见:一个词、一个十六进制前缀、一个路径片段
#   2. 攻击样本里,它几乎从不单独出现 —— 总有更精确的规则同时命中
#   3. 它误伤的是"正常内容",不是"正常请求的形状"
#
# 只降这 5 条是保守选择:再往下降(PAT-001 `../`、SQL-001 `union select`)
# 会把真实攻击也变成 ALERT,评测里有专门的对照数据。
# ---------------------------------------------------------------------------

default BLOCK

# 出现 select 五个字母就拦 —— 技术文档、博客正文、SQL 教程全中招。
# 注意:规则文件里本来写的是 `select `(带尾空格,本意"select 后跟空格"),
# 但加载器会 trim 掉尾空格,所以它实际变成了裸词匹配。这里不修加载器
# (修了会改变一批规则的语义),而是用策略把它的处置降级。
SQL-003 ALERT

# 十六进制字面量前缀:0x1f、0xFF 这类正常代码内容会被误伤
SQL-058 ALERT

# 正常静态资源路径,不是攻击特征
PAT-034 ALERT
PAT-035 ALERT

# 正常 HTML 表单元素,大量正经页面都含 <input>
XSS-007 ALERT

# 凭据探测里三个较宽的特征:技术文档正文可能提到这些文件名,
# 所以只记录不拦。见 rules/attack_patterns.txt 的 CRED-* 段。
CRED-016 ALERT
CRED-017 ALERT
CRED-018 ALERT
