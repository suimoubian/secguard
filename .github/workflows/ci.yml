name: CI

# 什么时候跑:每次 push 和 PR。
# 目的只有两个 —— 保证代码能编过,保证自检能过。
# 不做部署:部署是另一件事,而且需要真实机器和密钥。
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:      # 允许手动触发

# 同一个分支连着 push 时,取消还没跑完的旧运行 ——
# 否则改一行 push 三次,三个 Job 抢同一批资源,最后看到的是中间版本的结果。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # 故意钉 22.04 而不是 ubuntu-latest:
    # 本地开发环境就是 22.04,依赖包名和版本在这里能对上。
    # 用 latest 的话,哪天镜像升级到新 LTS,包名一变构建就莫名红掉。
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake g++ \
            libssl-dev \
            libmysqlcppconn-dev \
            libhiredis-dev \
            libcurl4-openssl-dev \
            nlohmann-json3-dev

      - name: 显示环境版本
        run: |
          cmake --version | head -1
          g++ --version | head -1
          docker --version

      - name: 配置(Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: 编译 + 检查警告
        # 原来这里是"编一次 + --clean-first 再编一次",等于白跑一遍全量编译。
        # 现在只编一次,用 pipefail 让编译失败也能正确中止,
        # 再把输出留下来查警告。
        #
        # 为什么警告要当错误:本地一直是零警告,不卡住的话警告会一路累积,
        # 直到某天真的出了事才被发现。
        run: |
          set -o pipefail
          cmake --build build -j"$(nproc)" 2>&1 | tee /tmp/build.log
          if grep -qE 'warning: [^ ]' /tmp/build.log; then
            echo "::error::发现编译警告"
            grep -E 'warning: [^ ]' /tmp/build.log | head -20
            exit 1
          fi
          echo "无编译警告"

      - name: AC 自动机对拍(与朴素实现比对)
        run: ./build/ac_test 20000

      - name: 单元自检
        # 不需要数据库;Redis 不可用时会自动走单机降级路径,所以不必起服务。
        run: ./build/unit_test

      - name: 引擎微基准(只跑一遍,确认没退化)
        run: ./build/ac_bench 500 2048

      - name: WAF 绕过评测(门禁)
        # 和本地 ci-local.sh 的第 5b 步一致。
        # 门禁看的是"误拦截率"(真的返回 403),不是"命中率" ——
        # 否则把规则全降级成 ALERT 也能让门禁变绿,那是假绿。
        run: |
          ./build/waf_eval \
            --rules rules/attack_patterns.txt \
            --policy rules/policy.conf \
            --corpus tools/waf_eval/corpus \
            --repeat 3 \
            --max-miss 0.10 --max-fp 0.25
          echo "门禁通过"

      - name: 配置三处一致性(.env / .env.example / 代码)
        # 背景:同一个配置要出现在三个地方才真正生效。这个坑踩过三次 ——
        # SECGUARD_AI_MERGE_IPS、SECGUARD_AUDIT_RETENTION_DAYS(把攻击证据删了)、
        # 以及 20 多个"设了但不生效"的参数。加这一步之后,漏一个变量会直接红。
        run: ./scripts/check-config-sync.sh

      - name: 规则库体检
        # 抓两类"不报错、只静默改变行为"的问题:
        #   1. 行首是 # 但带 TAB 的规则(会被当注释整行丢掉,曾经有过一条)
        #   2. 特征文本首尾带空白(加载时被 trim,文件写的和跑的不一样)
        # 这两类算结构性问题,直接失败。
        run: ./build/waf_eval --rules rules/attack_patterns.txt --lint-rules

      - name: 起 MySQL(DAO 测试用)
        # 用 docker 而不是 services: 是因为要把 db/schema.sql 挂进初始化目录,
        # services 没法挂仓库里的文件。等的是 "schema 建好"而不是"进程起来",
        # 后者会假就绪(compose 里踩过同样的坑)。
        run: |
          docker run -d --name mysql -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD=root-ci-only \
            -e MYSQL_DATABASE=secguard \
            -e MYSQL_USER=secguard \
            -e MYSQL_PASSWORD=ci-only-pass \
            -v "$PWD/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro" \
            mysql:8.0 --default-authentication-plugin=mysql_native_password

          ready=0
          for i in $(seq 1 60); do
            if docker exec mysql mysql -uroot -proot-ci-only \
                 -e "SELECT 1 FROM secguard.user LIMIT 1" >/dev/null 2>&1; then
              echo "MySQL + schema 就绪(第 $i 次探测)"
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "::error::MySQL 没有就绪"
            docker logs --tail 40 mysql
            exit 1
          fi

      - name: DAO 层测试(打真库)
        # dao_test 连不上会自动跳过并返回 0 —— 那是给本地用的。
        # 在 CI 里库已经起好了,如果它跳过了,说明环境有问题,不能算通过。
        env:
          SECGUARD_DB_HOST: 127.0.0.1
          SECGUARD_DB_PORT: "3306"
          SECGUARD_DB_NAME: secguard
          SECGUARD_DB_USER: secguard
          SECGUARD_DB_PASS: ci-only-pass
        run: |
          output=$(./build/dao_test)
          echo "$output"
          if echo "$output" | grep -q "跳过"; then
            echo "::error::DAO 测试被跳过了 —— 库就在本地,跳过说明连接失败"
            exit 1
          fi

      - name: 收尾(停掉 MySQL)
        if: always()
        run: docker rm -f mysql || true

# ===========================================================================
# 第二个作业:ASan + UBSan
#
# 为什么单独开一个作业而不是塞进上面:
#   1. sanitizer 要 Debug + 关优化,编出来的东西不能用来跑性能基准,
#      混在一个 job 里会让人误以为基准是"带 sanitizer 的数字";
#   2. 它失败的性质不同 —— 上面失败是"功能坏了",这里失败是"内存/UB 有问题",
#      分开显示更容易判断;
#   3. 两个 job 并行跑,墙钟时间几乎不增加。
#
# 为什么必须进 CI:
#   README / 简历 / 讲稿里都写了"ASan + UBSan 零报错",但在此之前**只在本地
#   手动跑过一次**,CI 从不验证 —— 和"有 CI 但从没跑过"是同一类问题。
#   声明过的验证方式必须在每次提交时自动复核。
# ===========================================================================
  sanitize:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake g++ libssl-dev \
            libmysqlcppconn-dev libhiredis-dev libcurl4-openssl-dev \
            nlohmann-json3-dev

      - name: 配置(Debug + ASan + UBSan)
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: 编译(只编引擎相关的目标)
        # 为什么只编 ac_test / waf_eval,不编 unit_test:
        #
        # sanitizer + Debug 下单个编译单元的内存占用会翻几倍 —— 本地实测
        # http_server.cpp 那一类大 TU 的 cc1plus 峰值 RSS 约 2.4 GB。
        # GitHub 的 runner 是 2 核 7 GB,把整个 unit_test 链上的十几个 TU
        # 都编一遍既慢(本地 20 核都要十几分钟)又逼近内存上限。
        #
        # 而 ac_test / waf_eval 只依赖 engine + log,几秒就能编完,
        # 也正好覆盖文档里声称的那句"ASan + UBSan 跑完整一轮对拍"。
        run: |
          cmake --build build-asan -j2 --target ac_test waf_eval

      - name: AC 自动机对拍(ASan + UBSan + 泄漏检测)
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./build-asan/ac_test 20000

      - name: WAF 评测(引擎 + 策略全走一遍 sanitizer)
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ./build-asan/waf_eval \
            --rules rules/attack_patterns.txt \
            --policy rules/policy.conf \
            --corpus tools/waf_eval/corpus \
            --repeat 1
