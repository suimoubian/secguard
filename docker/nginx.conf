# Nginx 反代配置
#
# 职责划分:
#   nginx  收 TLS、限连接数、把真实客户端 IP 传给后端
#   app    自己限流、自己封禁、自己检测
#
# 为什么 IP 要由 nginx 传:
#   容器网络里 app 看到的 remote_addr 永远是 nginx 的地址。
#   不解这一层,所有请求都会被当成同一个 IP —— 封禁会误伤所有人,
#   限流也会变成一个全局桶。

# ---------------------------------------------------------------------------
# Docker 内置 DNS。必须配,否则会出现下面这个坑:
#
#   nginx 默认只在启动时解析一次 upstream 里的域名,然后把 IP 缓存住。
#   容器一旦被重建(compose up --force-recreate、镜像更新、主机重启后
#   restart 策略拉起),app 会拿到新 IP,而 nginx 还指着旧 IP ——
#   于是表现为 app 明明 healthy,nginx 却一直 502。
#
#   实测就踩到了:app 容器 "Up (healthy)",但从浏览器访问全是 502。
#
#   resolver + server ... resolve 让 nginx 定期重新解析(valid=10s)。
#   127.0.0.11 是 Docker 的嵌入式 DNS。
# ---------------------------------------------------------------------------
resolver 127.0.0.11 valid=10s ipv6=off;

upstream secguard_app {
    # resolve 动态重解析需要配合 zone(共享内存区)
    zone secguard_app 64k;
    # app 在 compose 网络里叫 app,端口 8080
    server app:8080 resolve;
    keepalive 32;          # 长连接:省掉每次请求重建 TCP 的开销
}

# 简单的连接数限制:单 IP 同时最多 50 个连接(第 41 讲)
limit_conn_zone $binary_remote_addr zone=perip:10m;

server {
    listen 80;
    server_name _;

    # 请求体上限要和 app 里的 set_payload_max_length 对得上,
    # 否则会出现"nginx 放过去了、app 又拒了"的割裂现象。
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # 简单压一下并发,避免连接池被占满(第 47 讲)
    limit_conn perip 50;

    # 访问日志: 加上耗时和后端地址,排查问题要用
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    location / {
        proxy_pass http://secguard_app;
        proxy_http_version 1.1;

        # 关键:把真实客户端 IP 传下去。
        # 覆盖式设置 X-Forwarded-For(而不是追加 $proxy_add_x_forwarded_for),
        # 是为了防止客户端自己带一个伪造的 XFF 混进来 ——
        # 追加的写法会把 client 自带的 XFF 放在最左边,而 app 取最左边那个。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header Host $host;
        proxy_set_header Connection "";

        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;

        # 不让 nginx 缓存任何东西:审计结果必须实时
        proxy_buffering off;
    }

    # 健康检查单独放行,不加连接数限制
    location = /health {
        limit_conn perip 200;
        proxy_pass http://secguard_app/health;
        proxy_set_header X-Forwarded-For $remote_addr;
        access_log off;
    }
}
