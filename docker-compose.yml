# SecGuard 一键部署
#
# 用法:
#   cp .env.example .env      # 改里面的口令与密钥
#   docker compose up -d --build
#   curl http://localhost/health
#
# 四个服务:
#   nginx  对外唯一入口,反代到 app
#   app    SecGuard 主程序
#   mysql  业务库
#   redis  限流/封禁/重放的共享状态
#
# 内存估算(2 核 4G 的机器跑得下):
#   mysql ~400MB  redis ~60MB  app ~80MB  nginx ~15MB

services:
  # -------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: secguard-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须在 .env 里设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${SECGUARD_DB_NAME:-secguard}
      MYSQL_USER: ${SECGUARD_DB_USER:-secguard}
      MYSQL_PASSWORD: ${SECGUARD_DB_PASS:?必须在 .env 里设置 SECGUARD_DB_PASS}
    command:
      # 2 核 4G 的机器上,默认的缓冲池(通常是物理内存的 50%)太贪
      - --innodb-buffer-pool-size=128M
      - --max-connections=150
      # 限制单条查询与包大小,别让一个请求把内存吃光
      - --max-allowed-packet=16M
      - --slow-query-log=1
      - --long-query-time=1
      # 兼容老连接器的认证方式(Connector/C++ 1.1.x)
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      # 首次初始化时自动建库建表(schema.sql 是幂等的)
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      # 不能只 ping:初始化脚本可能还没跑完。
      # 这里直接查一张业务表,确保 schema 真的建好了才放行 app。
      test: ["CMD-SHELL",
             "mysql -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1 FROM ${SECGUARD_DB_NAME:-secguard}.user LIMIT 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [backend]
    # 不对外暴露 3306:数据库只让 app 连,不给外网开口子
    expose: ["3306"]

  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: secguard-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      # 状态数据丢失的后果:限流计数从零开始、nonce 可重放一次。
      # 用 AOF 降低这个风险,同时限制内存别把机器拖垮。
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - "900 1"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [backend]
    expose: ["6379"]

  # -------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 并行编译作业数。默认 2,内存小的机器(2G)在 .env 里设
        # SECGUARD_BUILD_JOBS=1,否则单个 g++ 峰值 1GB 会把内存打爆,
        # 表现为构建阶段被 OOM 杀掉、只报一句 Killed。
        BUILD_JOBS: ${SECGUARD_BUILD_JOBS:-2}
    container_name: secguard-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SECGUARD_DB_HOST: mysql
      SECGUARD_DB_PORT: "3306"
      SECGUARD_DB_USER: ${SECGUARD_DB_USER:-secguard}
      SECGUARD_DB_PASS: ${SECGUARD_DB_PASS:?必须在 .env 里设置 SECGUARD_DB_PASS}
      SECGUARD_DB_NAME: ${SECGUARD_DB_NAME:-secguard}
      SECGUARD_DB_POOL: ${SECGUARD_DB_POOL:-8}

      SECGUARD_JWT_SECRET: ${SECGUARD_JWT_SECRET:?必须在 .env 里设置 SECGUARD_JWT_SECRET}
      # 管理员用户名名单(逗号分隔)。只有名单里的用户能访问
      # /api/alerts、/api/audit/*、/api/analyze/*、/api/rules* 这些管理接口。
      # 留空 = 管理接口全部关闭(fail-closed),不会出现"忘了配等于没锁"。
      SECGUARD_ADMIN_USERS: ${SECGUARD_ADMIN_USERS:-}

      SECGUARD_REDIS_HOST: redis
      SECGUARD_REDIS_PORT: "6379"
      SECGUARD_REDIS_ENABLE: "1"

      SECGUARD_BIND: 0.0.0.0
      SECGUARD_PORT: "8080"
      SECGUARD_LOG_LEVEL: ${SECGUARD_LOG_LEVEL:-info}

      # 前面有 nginx 兜着,且 nginx 用 $remote_addr 覆盖 XFF(不是追加),
      # 所以这里可以放心信任它。如果哪天把 app 直接暴露出去,必须改成 0,
      # 否则攻击者伪造一个 X-Forwarded-For 就能绕过按 IP 的限流与封禁。
      SECGUARD_TRUST_PROXY: "1"

      SECGUARD_PATTERN_FILE: /app/rules/attack_patterns.txt
      # 归一化检测层(项目 A):1 = 原始遍 + 归一化遍,0 = 只做字面匹配。
      # 设 0 可以一键回滚到改造前的行为 —— 线上真出问题,先关它再查原因,
      # 而不是回滚镜像。做 A/B 性能对照也用它。
      SECGUARD_ENGINE_NORMALIZE: ${SECGUARD_ENGINE_NORMALIZE:-1}
      SECGUARD_RATE_PER_SEC: ${SECGUARD_RATE_PER_SEC:-200}
      SECGUARD_RATE_BURST: ${SECGUARD_RATE_BURST:-400}
      SECGUARD_HIT_THRESHOLD: ${SECGUARD_HIT_THRESHOLD:-20}
      SECGUARD_BAN_SECONDS: ${SECGUARD_BAN_SECONDS:-1800}

      # -----------------------------------------------------------------------
      # 两个"实战得到"的参数
      #
      # 教训:加一个新配置项要改**三处** —— config.cpp(读)、.env.example(文档)、
      # 和这里(传给容器)。少改最后这一处,程序读到的永远是代码默认值,
      # .env 里写什么都没用。实测踩过:聚合门槛在 .env 设成 2,
      # 容器里还是默认的 3,聚合一直不触发,查了半小时。
      # -----------------------------------------------------------------------
      # 被封禁的 IP 继续刷请求时,审计记录的最小间隔(秒)。0 = 每条都记。
      SECGUARD_BAN_AUDIT_INTERVAL: ${SECGUARD_BAN_AUDIT_INTERVAL:-60}
      # 同轮内同类威胁来自 >= N 个不同 IP 时,聚合成一条"分布式扫描"告警。
      SECGUARD_AI_MERGE_IPS: ${SECGUARD_AI_MERGE_IPS:-3}

      # ---- AI 分析层(W6)----
      # 默认关闭:没有 API Key 就不该跑。
      # 要演示可以设 SECGUARD_LLM_PROVIDER=mock(不联网,结果会是假数据)。
      SECGUARD_AI_ENABLE: ${SECGUARD_AI_ENABLE:-0}
      SECGUARD_AI_INTERVAL: ${SECGUARD_AI_INTERVAL:-120}
      SECGUARD_AI_BATCH: ${SECGUARD_AI_BATCH:-10}
      SECGUARD_AI_MIN_CONFIDENCE: ${SECGUARD_AI_MIN_CONFIDENCE:-0.6}
      SECGUARD_AI_RPM: ${SECGUARD_AI_RPM:-10}
      SECGUARD_LLM_PROVIDER: ${SECGUARD_LLM_PROVIDER:-openai}
      SECGUARD_LLM_BASE_URL: ${SECGUARD_LLM_BASE_URL:-https://api.deepseek.com/v1}
      SECGUARD_LLM_MODEL: ${SECGUARD_LLM_MODEL:-deepseek-chat}
      # 密钥从 .env 来,绝不出现在镜像或代码里
      SECGUARD_LLM_KEY: ${SECGUARD_LLM_KEY:-}

      # ---- 告警通知 ----
      # 留空 = 不通知(告警仍然落库)。
      # 注意:如果端点在宿主机上,容器里要用 host.docker.internal 或网桥网关地址,
      # 用 127.0.0.1 指的是容器自己。
      SECGUARD_ALERT_WEBHOOK: ${SECGUARD_ALERT_WEBHOOK:-}
      SECGUARD_ALERT_MIN_SEVERITY: ${SECGUARD_ALERT_MIN_SEVERITY:-HIGH}
      SECGUARD_ALERT_TIMEOUT_MS: ${SECGUARD_ALERT_TIMEOUT_MS:-3000}
    networks: [backend]
    # 注意:这里**不**加 ports 映射。
    # 程序信任 X-Forwarded-For 头来取真实 IP,如果直接对外暴露,
    # 攻击者伪造一个 XFF 就能绕过 IP 封禁。所以只让 nginx 进来。
    expose: ["8080"]
    # 日志走 stdout,交给 docker 收集(别在容器里写文件)
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    # 优雅停机留足时间:要把审计队列写干净(第 69 讲)
    stop_grace_period: 30s

  # -------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: secguard-nginx
    restart: unless-stopped
    depends_on:
      app:
        # 必须是 service_healthy 而不是 service_started。
        # app 要等数据库就绪才绑定端口,用 service_started 的话 nginx 会先起来,
        # 这段时间里所有请求都拿到 502 —— 用户看到的就是"打不开"。
        # 改成等健康检查通过,nginx 一起来就能正常服务。
        condition: service_healthy
    ports:
      # 主端口:对外访问地址用这个,写进简历和演示链接
      - "${SECGUARD_HTTP_PORT:-8088}:80"
      # ---------------------------------------------------------------------
      # 额外映射 80 端口。
      #
      # 为什么:通用扫描器主要扫 80/443,极少扫 8088。想在公网收到真实攻击
      # 流量(而不是全靠自己压),就得让服务出现在 80 上。
      # 一个容器端口映射到两个宿主端口是允许的,所以 8088 照常可用,不中断。
      #
      # 用 IP 直接访问 80 不需要 ICP 备案(备案是域名解析的要求)。
      # 不想要这个端口的话,删掉下面这一行再 `docker compose up -d` 即可。
      # ---------------------------------------------------------------------
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [backend]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  backend:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
